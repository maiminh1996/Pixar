services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ../config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  esp32-simulator:
    build:
      context: ..
      dockerfile: brain/Dockerfile
    container_name: esp32-simulator
    command: ["python3", "-m", "brain.hardware.simulator", "--host", "mqtt-broker"]
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mqtt-broker
    profiles:
      - sim
    restart: unless-stopped
