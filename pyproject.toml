[project]
name = "ai-companion-robot"
version = "0.2.0"
description = "Autonomous Pixar AI Companion Robot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "paho-mqtt>=2.0.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "schemas"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
